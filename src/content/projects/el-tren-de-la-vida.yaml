details:
  Main Focus: Develop a subjective metaphor driven game.
  Notable Features: Seasonal train stops that mirror life stages. Draw, model, write good narrative and design the puzzles for the 4 stations.
  Technologies Used: Unity, Blender, Affinity Designer, FL Studio.
  Music: The music was handmade by me for this game specifically. It changes on each station.
  Game Jam: This project was part of the Game Jam El Modern Girona 2025. This project done in 48h and the theme was "Connection/Disconnection".
  Challenges Faced: Balancing clarity of the metaphor with subtlety, joining it with the puzzle minigame, and building atmosphere fast during a game jam.
  Authors: Aleix Ferré, Joaquín Villena, Arnau Albertí, Guillem Rodriguez, Sara Cañada.
goodForYouIf:
  - You enjoy short reflective experiences about presence versus technology.
  - You like narrative games that use symbolism instead of exposition.
  - You want an atmospheric journey you can finish in less than an hour.
whatILearned:
  - How to express a metaphor through mechanics, pacing, and art direction.
  - How to prioritize mood and narrative beats under tight jam deadlines.
  - How to align a multidisciplinary team quickly around a shared vision.
