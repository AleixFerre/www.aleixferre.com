order: 5
name: El tren de la vida
description: A metaphor for the protagonist's entire life condensed into a single year. Each season is a train station. Each station is an important moment in your life that you miss because you're disconnected, absorbed in your phone. While you disconnect from life, you remain connected to your phone.
